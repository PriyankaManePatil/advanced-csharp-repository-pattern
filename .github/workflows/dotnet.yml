name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AdvancedRepositoryPattern.sln
      - run: dotnet build AdvancedRepositoryPattern.sln --configuration Release --no-restore
      - run: dotnet test AdvancedRepositoryPattern.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
